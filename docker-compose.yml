# Watchpost local stack. Start everything with:  docker compose up --build
#
# Values come from .env when present (copy .env.example); the defaults below
# are for local use only.

name: watchpost

x-backend-env: &backend-env
  WATCHPOST_ENV: ${WATCHPOST_ENV:-development}
  WATCHPOST_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-watchpost}:${POSTGRES_PASSWORD:-watchpost}@db:5432/${POSTGRES_DB:-watchpost}
  WATCHPOST_REDIS_URL: redis://redis:6379/0
  WATCHPOST_SECRET_KEY: ${WATCHPOST_SECRET_KEY:-}
  WATCHPOST_LOG_LEVEL: ${WATCHPOST_LOG_LEVEL:-INFO}
  WATCHPOST_LOG_FORMAT: ${WATCHPOST_LOG_FORMAT:-json}
  WATCHPOST_CORS_ORIGINS: ${WATCHPOST_CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
  WATCHPOST_UPLOAD_DIR: /data/uploads
  WATCHPOST_WATCH_DIR: /data/watch
  WATCHPOST_MAX_UPLOAD_BYTES: ${WATCHPOST_MAX_UPLOAD_BYTES:-536870912}
  WATCHPOST_WATCH_ENABLED: ${WATCHPOST_WATCH_ENABLED:-true}
  WATCHPOST_WATCH_INTERVAL_SECONDS: ${WATCHPOST_WATCH_INTERVAL_SECONDS:-10}
  WATCHPOST_KEEP_UPLOADS: ${WATCHPOST_KEEP_UPLOADS:-false}
  WATCHPOST_ABUSEIPDB_API_KEY: ${WATCHPOST_ABUSEIPDB_API_KEY:-}
  WATCHPOST_VIRUSTOTAL_API_KEY: ${WATCHPOST_VIRUSTOTAL_API_KEY:-}
  WATCHPOST_ENRICHMENT_CACHE_HOURS: ${WATCHPOST_ENRICHMENT_CACHE_HOURS:-24}
  WATCHPOST_ABUSEIPDB_DAILY_LIMIT: ${WATCHPOST_ABUSEIPDB_DAILY_LIMIT:-1000}
  WATCHPOST_VIRUSTOTAL_PER_MINUTE: ${WATCHPOST_VIRUSTOTAL_PER_MINUTE:-4}
  WATCHPOST_VIRUSTOTAL_DAILY_LIMIT: ${WATCHPOST_VIRUSTOTAL_DAILY_LIMIT:-500}

x-backend: &backend
  build:
    context: ./backend
  image: watchpost-backend:local
  environment: *backend-env
  restart: unless-stopped

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-watchpost}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-watchpost}
      POSTGRES_DB: ${POSTGRES_DB:-watchpost}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Bound to localhost only; handy for psql and running the test suite.
      - "127.0.0.1:${WATCHPOST_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    <<: *backend
    # Schema migrations, then load the built-in detection rules into the database.
    command: ["sh", "-c", "alembic upgrade head && watchpost sync-rules"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *backend
    ports:
      - "127.0.0.1:${WATCHPOST_API_PORT:-8000}:8000"
    volumes:
      - uploads:/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  worker:
    <<: *backend
    command: ["arq", "watchpost.worker.settings.WorkerSettings"]
    volumes:
      - uploads:/data/uploads
      # Drop log files into ./watch on the host; the worker only reads them.
      - ./watch:/data/watch:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "arq", "--check", "watchpost.worker.settings.WorkerSettings"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
    image: watchpost-frontend:local
    ports:
      - "127.0.0.1:${WATCHPOST_UI_PORT:-3000}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  uploads:
