id: linux-user-added-to-admin-group
title: User added to a Linux admin group
description: |
  An account was added to sudo, wheel, admin or root. Membership in these
  groups grants full administrative rights, so it is a common way to turn a
  newly created or compromised account into a persistent admin. Together
  with "Local user account created on Linux" this is the pattern of an
  attacker creating their own admin user.
severity: high
mitre:
  tactics: [TA0003, TA0004]
  techniques: [T1098]
logsource:
  source: linux_auth
detection:
  added_to_group:
    event.action: user_added_to_group
    details.group: [sudo, wheel, admin, root]
  condition: added_to_group
group_by: [host.name, user.name]
falsepositives:
  - A new administrator being onboarded through the normal change process
references:
  - https://attack.mitre.org/techniques/T1098/
