id: ssh-password-spraying
title: SSH password spraying
description: |
  One source address failing SSH logins for many different accounts.
  Password spraying tries a few common passwords against many usernames to
  stay under per-account lockout limits, so it shows up as breadth (distinct
  users) rather than volume against one account. Invalid usernames count
  too: guessing account names is part of the technique.
severity: medium
type: threshold
mitre:
  tactics: [TA0006]
  techniques: [T1110.003]
logsource:
  source: linux_auth
detection:
  failed_login:
    event.action: [ssh_login, ssh_invalid_user]
    event.outcome: failure
  condition: failed_login
group_by: [source.ip]
threshold:
  count: 5
  timeframe: 10m
  distinct: user.name
falsepositives:
  - A jump host or NAT gateway shared by many users who mistype passwords
  - Configuration management connecting with several service accounts
references:
  - https://attack.mitre.org/techniques/T1110/003/
