name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - name: Run file-level pre-commit hooks
        # mypy, eslint, prettier and tsc run in the dedicated jobs below.
        env:
          SKIP: mypy,prettier,eslint,tsc
        run: uvx pre-commit run --all-files --show-diff-on-failure

  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: watchpost
          POSTGRES_PASSWORD: watchpost
          POSTGRES_DB: watchpost_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U watchpost -d watchpost_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      WATCHPOST_TEST_DATABASE_URL: postgresql+asyncpg://watchpost:watchpost@localhost:5432/watchpost_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies
        run: uv sync --frozen
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy (strict)
        run: uv run mypy
      - name: Migrations are in sync with models
        env:
          WATCHPOST_DATABASE_URL: postgresql+asyncpg://watchpost:watchpost@localhost:5432/watchpost_test
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
      - name: Tests with coverage
        run: uv run pytest --cov --cov-report=term --cov-report=xml

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Prettier
        run: npm run format:check
      - name: ESLint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
